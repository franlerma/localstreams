services:

  localstreams-regular:
    image: franlerma/localstreams
    container_name: localstreams
    profiles: [ 'regular' ]
    ports:
      - "15123:15123"
    volumes:
      - /dev/dri:/dev/dri
      - /opt/docker/volumes/localstreams/m3u:/data/m3u
      - /opt/docker/volumes/localstreams/picon:/data/picon
      - /opt/docker/volumes/localstreams/tmp:/tmp/acestream-cache
    environment:
      - ACESTREAM_PROXY_HOST=acexy-regular
      - ACESTREAM_PROXY_PORT=8080
      - ACESTREAM_POLL_TIME=0
      - ACESTRAM_RETRY_TOTAL=10
      - APP_LOG_LEVEL=INFO
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - wud.watch=false
    restart: always
    stdin_open: true
    tty: true
    dns:
      - 1.1.1.1
      - 1.0.0.1
    depends_on:
      - acexy-regular
    networks:
      - media-network

  localstreams-warp:
    image: franlerma/localstreams
    container_name: localstreams
    profiles: [ 'warp' ]
    ports:
      - "15123:15123"
    volumes:
      - /dev/dri:/dev/dri
      - /opt/docker/volumes/localstreams/m3u:/data/m3u
      - /opt/docker/volumes/localstreams/picon:/data/picon
      - /opt/docker/volumes/localstreams/tmp:/tmp/acestream-cache
    environment:
      - ACESTREAM_PROXY_HOST=acexy-warp
      - ACESTREAM_PROXY_PORT=8080
      - ACESTREAM_POLL_TIME=0
      - ACESTRAM_RETRY_TOTAL=10
      - APP_LOG_LEVEL=DEBUG
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - wud.watch=false
    restart: always
    stdin_open: true
    tty: true
    depends_on:
      - acestream
      - warp
    networks:
      - media-network

  acexy-regular:
    container_name: acexy
    profiles: [ 'regular' ]
    image: ghcr.io/krinkuto11/acexy-orchestrator:latest
    restart: always
    ports:
      - 8080:8080/tcp
    environment:
      ACEXY_ADDR: ":8080"               # Listen on port 8080
      ACEXY_SCHEME: "http"              # Use HTTP
      ACEXY_HOST: "acestream-regular"   # Host is "acestream" or the name of the AceStream service
      ACEXY_PORT: "6878"                # Port is 6878
      ACEXY_TIMEOUT: "60s"              # Stream timeout when in M3U8 mode
      ACEXY_M3U8: "false"               # Disable M3U8 mode
      ACEXY_EMPTY_TIMEOUT: "60s"        # Timeout to close the connection if no data is received
      ACEXY_BUFFER: "4.2MiB"            # Buffer size for smooth playback (prevents frame drops)
      ACEXY_NO_RESPONSE_TIMEOUT: "10s"  # Timeout to close the connection if no response is received
      STREAM_LOOP_DETECTION_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock      
    depends_on:
      - acestream-regular
    networks:
      - media-network

  acexy-warp:
    container_name: acexy
    profiles: [ 'warp' ]
    image: ghcr.io/krinkuto11/acexy-orchestrator:latest
    restart: always
    ports:
      - 8080:8080/tcp
    environment:      
      ACEXY_ADDR: ":8080"               # Listen on port 8080
      ACEXY_SCHEME: "http"              # Use HTTP
      ACEXY_HOST: "warp"                # Host is "warp" since acestream shares network with warp
      ACEXY_PORT: "6878"                # Port is 6878
      ACEXY_TIMEOUT: "60s"              # Stream timeout when in M3U8 mode
      ACEXY_M3U8: "false"               # Disable M3U8 mode
      ACEXY_EMPTY_TIMEOUT: "60s"        # Timeout to close the connection if no data is received
      ACEXY_BUFFER: "4.2MiB"            # Buffer size for smooth playback (prevents frame drops)
      ACEXY_NO_RESPONSE_TIMEOUT: "10s"  # Timeout to close the connection if no response is received
      STREAM_LOOP_DETECTION_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    links:
      - warp  # Conectar a warp ya que acestream comparte su red
    depends_on:
      - warp  # Cambiar dependencia a warp
    networks:
      - media-network

  acestream-regular:
    container_name: acestream
    image: martinbjeldbak/acestream-http-proxy:latest
    profiles: [ 'regular' ]
    platform: linux/amd64
    restart: always
    volumes:
      - /opt/docker/volumes/localstreams/tmp/acestream-cache:/home/appuser/.ACEStream/.acestream_cache
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      - media-network

  acestream-warp:
    container_name: acestream
    image: martinbjeldbak/acestream-http-proxy:latest
    profiles: [ 'warp' ]
    platform: linux/amd64
    restart: always
    volumes:
      - /opt/docker/volumes/localstreams/tmp/acestream-cache:/home/appuser/.ACEStream/.acestream_cache
    depends_on:
      - warp
    network_mode: "service:warp"  # Usar la misma interfaz de red que warp

  warp:
    image: caomingjun/warp:latest
    container_name: warp
    profiles: [ 'warp']
    restart: always
    privileged: true
    devices:                   
      - /dev/net/tun:/dev/net/tun
    device_cgroup_rules:
      - 'c 10:200 rwm'
    ports:
      - "1080:1080"
      # - "6890:6878"  # Puerto HTTP de acestream
      - "8621:8621"  # Puerto P2P principal de acestream
      - "6881-6889:6881-6889"  # Rango de puertos para conexiones BitTorrent/P2P
    environment:
      - WARP_SLEEP=2
      # - WARP_LICENSE_KEY= # optional
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - /tmp/data:/var/lib/cloudflare-warp
    networks:
      - media-network

# Red personalizada para comunicación entre contenedores
networks:
  media-network:
    driver: bridge