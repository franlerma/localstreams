x-localstreams-env: &localstreams-env
  ACESTREAM_PROXY_PORT: "8080"
  ACESTREAM_POLL_TIME: "0"
  ACESTRAM_RETRY_TOTAL: "10"
  APP_LOG_LEVEL: "DEBUG"

x-localstreams-base: &localstreams-base
  image: franlerma/localstreams
  container_name: localstreams
  ports:
    - "15123:15123"
  volumes:
    - /dev/dri:/dev/dri
    - /opt/docker/volumes/localstreams/m3u:/data/m3u
    - /opt/docker/volumes/localstreams/picon:/data/picon
    - /opt/docker/volumes/localstreams/tmp:/tmp/acestream-cache
  environment:
    <<: *localstreams-env
  labels:
    - com.centurylinklabs.watchtower.enable=false
    - wud.watch=false
  restart: always
  stdin_open: true
  tty: true
  dns:
    - 1.1.1.1
    - 1.0.0.1
  networks:
    - localstreams-network

x-acexy-env: &acexy-env
  # Acexy core config
  ACEXY_LISTEN_ADDR: ":8080"
  ACEXY_SCHEME: "http"
  ACEXY_M3U8_STREAM_TIMEOUT: "60s"
  ACEXY_M3U8: "false"
  ACEXY_EMPTY_TIMEOUT: "20s"
  ACEXY_BUFFER_SIZE: "4MB"
  ACEXY_NO_RESPONSE_TIMEOUT: "3s"
  ACEXY_LOG_LEVEL: "INFO"

  ACEXY_ACESTREAM_DNS_SERVERS: "1.1.1.1,1.0.0.1"

  # Orchestrator config
  ACESTREAM_MIN_REPLICAS: "1"
  ACESTREAM_MAX_REPLICAS: "5"
  ACESTREAM_STREAMS_PER_INSTANCE: "3"
  ACESTREAM_IDLE_TIMEOUT: "5s"
  ACESTREAM_RECYCLE_TIMEOUT: "15s"
  # ACESTREAM_IMAGE usa por defecto franlerma/acestream-vpn-switch (default en
  # el código de acexy). Sin override manual.

  # VPN routing: empty = regular bridge mode (no VPN). acexy-vpn overrides this
  # to route traffic through the "warp" container. ACESTREAM_VPN_SWITCH_AFTER:
  # 0 = stay on VPN permanently, >0 = switch back to normal after N seconds.
  ACESTREAM_VPN_CONTAINER: ""
  ACESTREAM_VPN_SWITCH_AFTER: "45s"

  # Docker socket proxy
  DOCKER_HOST: "tcp://localstreams-docker-proxy:2375"

x-acexy-base: &acexy-base
  image: franlerma/acexy:latest
  restart: always
  environment:
    <<: *acexy-env
  depends_on:
      localstreams-docker-proxy:
        condition: service_started
  networks:
    - localstreams-network

services:

  localstreams-regular:
    <<: *localstreams-base
    profiles: [ 'regular' ]
    environment:
      - ACESTREAM_PROXY_HOST=acexy-regular
    depends_on:
      - acexy-regular

  localstreams-vpn:
    <<: *localstreams-base
    profiles: [ 'vpn' ]
    environment:
      <<: *localstreams-env
      ACESTREAM_PROXY_HOST: "acexy-vpn"
    depends_on:
      acexy-vpn:
        condition: service_healthy
      # warp queda cubierto transitivamente a través de acexy-vpn

  localstreams-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: localstreams-docker-proxy
    privileged: true
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - localstreams-network
    restart: unless-stopped

  acexy-regular:
    <<: *acexy-base
    container_name: acexy
    profiles: [ 'regular' ]

  acexy-vpn:
    <<: *acexy-base
    profiles: [ 'vpn' ]
    environment:
      <<: *acexy-env
      ACESTREAM_VPN_CONTAINER: "warp"
      # VPN permanente: 0 = nunca vuelve a la red normal
      ACESTREAM_VPN_SWITCH_AFTER: "0s"
    links:
      - warp
    depends_on:
      warp:
        condition: service_healthy
        # service_healthy: espera a que warp confirme VPN conectada
        # (healthcheck de warp = curl cloudflare.com verifica warp=on)

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    environment:
      # Solo muestra contenedores de stacks compose (todos los del proyecto).
      DOZZLE_FILTER: "label=com.docker.compose.project"
    ports:
      - "8081:8080"
    volumes:
      # Acceso read-only al socket para leer logs/eventos de los contenedores.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - localstreams-network

  warp:
    image: caomingjun/warp
    container_name: warp
    restart: always
    profiles: [ 'vpn' ]
    # add removed rule back (https://github.com/opencontainers/runc/pull/3468)
    device_cgroup_rules:
      - 'c 10:200 rwm'
    ports:
      - "1080:1080"
    environment:
      - WARP_SLEEP=2
      # - WARP_LICENSE_KEY= # optional
      # WARP_ENABLE_NAT: enables NAT so AceStream containers sharing the warp
      # network namespace can route their traffic out through the tunnel.
      - WARP_ENABLE_NAT=1
    cap_add:
      # Docker already have them, these are for podman users
      - MKNOD
      - AUDIT_WRITE
      # additional required cap for warp, both for podman and docker
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      # NAT required for acexy namespace sharing: forward routed traffic
      - net.ipv4.ip_forward=1
      # - net.ipv6.conf.all.forwarding=1
      # - net.ipv6.conf.all.accept_ra=2
    volumes:
      - warp-data:/var/lib/cloudflare-warp
    networks:
      - localstreams-network

networks:
  localstreams-network:
    driver: bridge

volumes:
  warp-data:
