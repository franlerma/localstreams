x-localstreams-base: &localstreams-base
  image: franlerma/localstreams
  build:
    context: .
    dockerfile: localstreams/Dockerfile
  container_name: localstreams
  ports:
    - "15123:15123"
  volumes:
    - /dev/dri:/dev/dri
    - /opt/docker/volumes/localstreams/m3u:/data/m3u
    - /opt/docker/volumes/localstreams/picon:/data/picon
    - /opt/docker/volumes/localstreams/tmp:/tmp/acestream-cache
  environment:
    - ACESTREAM_PROXY_PORT=8080
    - ACESTREAM_POLL_TIME=0
    - ACESTRAM_RETRY_TOTAL=10
    - APP_LOG_LEVEL=DEBUG
    - RESOLVER_SERVICE_URL=http://acestream-resolver:15124
  labels:
    - com.centurylinklabs.watchtower.enable=false
    - wud.watch=false
  restart: always
  stdin_open: true
  tty: true
  dns:
    - 1.1.1.1
    - 1.0.0.1
  networks:
    - localstreams-network

x-acexy-base: &acexy-base
  image: franlerma/acexy:latest
  restart: always
  ports:
    - 8080:8080/tcp
  environment:
    # Acexy core config
      ACEXY_LISTEN_ADDR: ":8080"
      ACEXY_SCHEME: "http"
      ACEXY_M3U8_STREAM_TIMEOUT: "60s"
      ACEXY_M3U8: "false"
      ACEXY_EMPTY_TIMEOUT: "20s"
      ACEXY_BUFFER_SIZE: "4MB"
      ACEXY_NO_RESPONSE_TIMEOUT: "10s"
      ACEXY_LOG_LEVEL: "INFO"

      # Orchestrator config
      ACESTREAM_MIN_REPLICAS: "1"
      ACESTREAM_MAX_REPLICAS: "5"
      ACESTREAM_STREAMS_PER_INSTANCE: "3"
      ACESTREAM_IDLE_TIMEOUT: "5s"
      ACESTREAM_RECYCLE_TIMEOUT: "15s"
      ACESTREAM_IMAGE: "blaiseio/acelink:latest"
      COMPOSE_PROFILE: "regular"

      # Docker socket proxy
      DOCKER_HOST: "tcp://localstreams-docker-proxy:2375"
  depends_on:
      localstreams-docker-proxy:
        condition: service_started
  networks:
    - localstreams-network

services:

  localstreams-regular:
    <<: *localstreams-base
    profiles: [ 'regular' ]
    environment:
      - ACESTREAM_PROXY_HOST=acexy-regular
    depends_on:
      - acexy-regular
      - acestream-resolver

  localstreams-vpn:
    <<: *localstreams-base
    profiles: [ 'vpn' ]
    environment:
      - ACESTREAM_PROXY_HOST=acexy-vpn
    depends_on:
      - acexy-vpn
      - acestream-vpn
      - gluetun
      - acestream-resolver

  localstreams-docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: localstreams-docker-proxy
    privileged: true
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
      DELETE: 1
      NETWORKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - localstreams-network
    restart: unless-stopped

  acestream-resolver:
    image: franlerma/acestream-resolver
    build:
      context: ./acestream-resolver
    container_name: acestream-resolver
    ports:
      - "15124:15124"
    environment:
      - ACESTREAM_RESOLVER_SOURCES=https://ipfs.io/ipns/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes.m3u,https://ipfs.io/ipns/k2k4r8lm8tkmuxbc8lkmq1in3v0oya1p6pe9o5bu0hu30br5ko08k2gb/data/listas/lista_fuera_iptv.m3u
      - ACESTREAM_RESOLVER_REFRESH_INTERVAL=1800
      - LOCALSTREAMS_BASE_URL=http://localstreams:15123
      - RESOLVER_PORT=15124
    networks:
      - localstreams-network
    restart: always

  acexy-regular:
    <<: *acexy-base
    container_name: acexy
    profiles: [ 'regular' ]

  acexy-vpn:
    <<: *acexy-base
    profiles: [ 'vpn' ]
    links:
      - gluetun
    depends_on:
      - gluetun

  gluetun:
    image: qmcgaw/gluetun
    profiles: [ 'vpn']
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "8888:8888/tcp"
      - "1080:1080"
      - "8621:8621"
      - "6881-6889:6881-6889"
    networks:
      - localstreams-network
    environment:
      - HTTPPROXY=on
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - VPN_ENDPOINT_IP=162.159.192.1
      - VPN_ENDPOINT_PORT=2408
      - WIREGUARD_PUBLIC_KEY=bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
      - WIREGUARD_PRIVATE_KEY=6AdkYWQn9rhnIDlaXH1GSjmcCR5B3RWxSBO6QWz0uEQ=
      - WIREGUARD_ADDRESSES=172.16.0.2/32

networks:
  localstreams-network:
    driver: bridge
