services:
  localstreams:
    image: franlerma/localstreams
    container_name: localstreams
    ports:
      - "15123:15123"
    volumes:
      - /dev/dri:/dev/dri
      - /opt/docker/volumes/localstreams/m3u:/data/m3u
      - /opt/docker/volumes/localstreams/picon:/data/picon
      - /opt/docker/volumes/localstreams/tmp:/tmp/acestream-cache
    environment:
      - ACESTREAM_PROXY_HOST=acexy
      - ACESTREAM_POLL_TIME=0
      - ACESTRAM_RETRY_TOTAL=10
      - ACESTREAM_ARGS=--live-cache-type memory
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - wud.watch=false
    restart: always
    stdin_open: true
    tty: true
    dns:
      - 1.1.1.1
      - 1.0.0.1
    depends_on:
      - acexy

  acexy:
    container_name: acexy
    image: ghcr.io/javinator9889/acexy:0.2.0
    restart: always
    ports:
      - 8080:8080/tcp
    environment:
      ACEXY_LISTEN_ADDR: ":8080"  # Listen on port 8080
      ACEXY_SCHEME: "http"        # Use HTTP
      ACEXY_HOST: "acestream"     # Host is "acestream" or the name of the AceStream service
      ACEXY_PORT: "6878"          # Port is 6878
      ACEXY_M3U8_STREAM_TIMEOUT: "60s"  # Timeout is 60 seconds when in M3U8 mode
      ACEXY_M3U8: "false"         # Disable M3U8 mode
      ACEXY_EMPTY_TIMEOUT: "60s"  # Timeout to close the connection if no data is received
      ACEXY_BUFFER_SIZE: 64MB      # Buffer size is 4MB
      ACEXY_NO_RESPONSE_TIMEOUT: "10s"  # Timeout to close the connection if no response is received
    links:
      - acestream
    depends_on:
      - acestream
      - warp

  warp:
    image: caomingjun/warp:latest
    container_name: warp
    restart: always
    # add removed rule back (https://github.com/opencontainers/runc/pull/3468)
    device_cgroup_rules:
      - 'c 10:200 rwm'
    ports:
      - "1080:1080"
    environment:
      - WARP_SLEEP=2
      # - WARP_LICENSE_KEY= # optional
      # - WARP_ENABLE_NAT=1 # enable nat
    cap_add:
      # Docker already have them, these are for podman users
      - MKNOD
      - AUDIT_WRITE
      # additional required cap for warp, both for podman and docker
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
      # uncomment for nat
      # - net.ipv4.ip_forward=1
      # - net.ipv6.conf.all.forwarding=1
      # - net.ipv6.conf.all.accept_ra=2
    volumes:
      - /tmp/data:/var/lib/cloudflare-warp

  acestream:
    container_name: acestream
    image: martinbjeldbak/acestream-http-proxy:latest
    platform: linux/amd64
    restart: always
    ports:
      - "8621:8621"
    depends_on:
      - warp
    environment:
      - EXTRA_FLAGS="--allow-user-config --bind-all --client-console --max-connections 1000 --max-peers 50 --max-upload-slots 7 --cache-limit 2 --use-internal-buffering true --make-default-access-token true --cache-auto true"
      - HTTP_PROXY=http://warp:1080