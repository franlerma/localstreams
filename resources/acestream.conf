# ================================================
# ACESTREAM ENGINE CONFIGURATION
# Configuración optimizada para conexión rápida
# ================================================

# === CONFIGURACIÓN BÁSICA ===
--allow-user-config
--bind-all
--client-console

# === OPTIMIZACIÓN PARA CONEXIÓN RÁPIDA ===
# Reducir peers iniciales para conexión más rápida
--max-connections 100
--max-peers 20
--max-upload-slots 4

# === CONFIGURACIÓN DE CACHE OPTIMIZADA ===
# Cache más grande para mejor rendimiento inicial
--cache-limit 10
--use-internal-buffering false
--cache-auto true

# === TIMEOUTS AGRESIVOS PARA INICIO RÁPIDO ===
--piece-request-timeout 10
--download-timeout 15

# === CONFIGURACIÓN DE RED OPTIMIZADA ===
--make-default-access-token true
--dht-port 6881

# === LOGGING REDUCIDO PARA MEJOR RENDIMIENTO ===
--log-stdout
--log-debug 0

# === OPTIMIZACIONES P2P ===
# Búsqueda más agresiva de peers iniciales
--tracker-request-timeout 5
--max-tracker-failures 2

# === OPTIMIZACIÓN DE BUFFERING ===
--live-cache-type memory
--vod-cache-type memory